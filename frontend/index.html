<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edinsured Treaty Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Edinsured Treaty Lab</h1>
    <h2>Monte Carlo Reinsurance Simulator</h2>

    <hr>

    <h3>Portfolio Details</h3>

    <label>Insurance Company</label>
    <input type="text" placeholder="ABC Insurance">

    <br><br>

    <label>Number of Policies</label>
    <input type="number" placeholder="10000">

    <br><br>

    <label>Claim Frequency</label>
    <input type="number" step="0.01" placeholder="0.05">

    <br><br>

    <label>Average Claim Severity</label>
    <input type="number" placeholder="500000">

    <br><br>

    <label>Severity Volatility</label>
    <input type="number" placeholder="0.50">


    <hr>


    <h3>Treaty Structure</h3>

    <label>Retention ($)</label>
    <input id="retention" type="number" placeholder="1000000">

    <br><br>

    <label>Limit ($)</label>
    <input id="limit" type="number" placeholder="5000000">


    <hr>


    <h3>Simulation Settings</h3>

    <label>Number of Simulations</label>
    <input id="simulations" type="number" placeholder="10000">

    <br><br>

    <button onclick="runSimulation()">
RUN SIMULATION
</button>
<script src="script.js"></script>

</body>

</html>
