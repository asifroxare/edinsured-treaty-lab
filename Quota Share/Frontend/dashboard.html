<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EdInsured Treaty Lab — Quota Share Simulator</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>EdInsured Treaty Lab</h1>
        <p class="subtitle">Quota Share Treaty Simulator — Student Interaction Lab (M4.5)</p>
      </div>
    </header>

    <main class="main-layout">
      <!-- 1. Interactive Configuration Panel -->
      <section class="config-panel">
        <div class="panel-title-bar">
          <h2>1. Configure Simulation</h2>
          <button type="button" id="reset-btn" class="btn btn-secondary btn-sm" title="Reset to standard defaults">
            Reset Portfolio
          </button>
        </div>

        <!-- Presets Selection Bar -->
        <div class="preset-section">
          <label class="preset-label">Try a Preset:</label>
          <div class="preset-chips-grid">
            <button type="button" class="preset-btn active" data-preset="standard">Standard (40% QS)</button>
            <button type="button" class="preset-btn" data-preset="high_loss">High Loss</button>
            <button type="button" class="preset-btn" data-preset="no_claims">No Claims</button>
            <button type="button" class="preset-btn" data-preset="full_qs">100% QS</button>
          </div>
        </div>

        <form id="simulation-form" novalidate>
          <!-- Treaty Parameters -->
          <div class="form-section">
            <h3>Treaty Parameters</h3>
            <div class="form-row-two">
              <div class="form-group">
                <label for="quota-share">Quota Share Cession (%)</label>
                <div class="input-addon-group">
                  <input type="number" id="quota-share" min="0" max="100" step="0.1" value="40" placeholder="0 - 100" required />
                  <span class="addon">%</span>
                </div>
                <div class="field-error" id="error-quota-share"></div>
              </div>

              <div class="form-group">
                <label for="ceding-comm">Ceding Commission (%)</label>
                <div class="input-addon-group">
                  <input type="number" id="ceding-comm" min="0" max="100" step="0.1" value="30" placeholder="0 - 100" required />
                  <span class="addon">%</span>
                </div>
                <div class="field-error" id="error-ceding-comm"></div>
              </div>
            </div>

            <!-- Portfolio-Level Expenses -->
            <div class="form-row-two">
              <div class="form-group">
                <label for="cedant-expenses">Cedant Expenses ($)</label>
                <div class="input-addon-group">
                  <span class="addon">$</span>
                  <input type="number" id="cedant-expenses" min="0" step="100" value="0" placeholder="0" />
                </div>
                <div class="field-error" id="error-cedant-expenses"></div>
              </div>

              <div class="form-group">
                <label for="reinsurer-expenses">Reinsurer Expenses ($)</label>
                <div class="input-addon-group">
                  <span class="addon">$</span>
                  <input type="number" id="reinsurer-expenses" min="0" step="100" value="0" placeholder="0" />
                </div>
                <div class="field-error" id="error-reinsurer-expenses"></div>
              </div>
            </div>
          </div>

          <!-- Dynamic Portfolio Editor -->
          <div class="form-section">
            <div class="portfolio-header-row">
              <h3>Portfolio Risks (<span id="risk-count-label">3</span>)</h3>
              <button type="button" id="add-risk-btn" class="btn btn-outline btn-xs">+ Add Risk</button>
            </div>
            <div class="field-error" id="error-portfolio-global"></div>

            <div id="risks-container" class="risks-list">
              <!-- Dynamically rendered risk rows -->
            </div>
          </div>

          <!-- Simulation Actions -->
          <div class="form-actions">
            <button type="submit" id="simulate-btn" class="btn btn-primary btn-block">
              <span class="btn-text">Run Simulation</span>
              <span class="btn-spinner" style="display: none;">Simulating portfolio...</span>
            </button>
          </div>
        </form>
      </section>

      <!-- 2. Results Dashboard Panel -->
      <section class="results-panel" id="results-panel-container">
        <div id="error-banner" class="error-banner" style="display: none;"></div>
        <div id="results-dashboard">
          <div class="placeholder-state">
            <div class="placeholder-icon">📊</div>
            <h3>Ready to Experiment</h3>
            <p>Modify treaty parameters or edit portfolio risks, then click <strong>"Run Simulation"</strong>.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
